apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: outage
spec:
  entryPoints: [websecure]
  routes:
  - kind: Rule
    match: Host(`outage.albertycliu.xyz`)
    services:
    - name: frontend
      port: 80
  tls:
    secretName: outage-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: outage-http-redirect
spec:
  entryPoints: [web]
  routes:
  - kind: Rule
    match: Host(`outage.albertycliu.xyz`)
    middlewares:
    - name: redirect-https
    services:
    - name: noop@internal
      kind: TraefikService
