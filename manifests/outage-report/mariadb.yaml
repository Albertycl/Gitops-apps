# Secret "outage-db" is created by hand and is not stored in Git (keys: password, database-url).
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: outage-report
spec:
  clusterIP: None
  selector: { app: mariadb }
  ports:
    - { name: mysql, port: 3306 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: outage-report
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels: { app: mariadb }
  template:
    metadata:
      labels: { app: mariadb }
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.1
          env:
            - { name: MARIADB_DATABASE, value: outage_report }
            - { name: MARIADB_USER, value: outage }
            - { name: MARIADB_RANDOM_ROOT_PASSWORD, value: "1" }
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: outage-db, key: password }
          ports:
            - { name: mysql, containerPort: 3306 }
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
            failureThreshold: 20
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
