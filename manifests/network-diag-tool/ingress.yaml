apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: admin
spec:
  entryPoints: [websecure]
  routes:
  - kind: Rule
    match: Host(`admin.albertycliu.xyz`)
    services:
    - name: admin-frontend
      port: 80
  tls:
    secretName: netdiag-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: diag
spec:
  entryPoints: [websecure]
  routes:
  - kind: Rule
    match: Host(`diag.albertycliu.xyz`)
    services:
    - name: user-frontend
      port: 80
  tls:
    secretName: netdiag-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: http-redirect
spec:
  entryPoints: [web]
  routes:
  - kind: Rule
    match: Host(`admin.albertycliu.xyz`) || Host(`diag.albertycliu.xyz`)
    middlewares:
    - name: redirect-https
    services:
    - name: noop@internal
      kind: TraefikService
