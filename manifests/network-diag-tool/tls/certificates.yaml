apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: admin-tls
  namespace: network-diag
spec:
  secretName: admin-tls
  dnsNames: [admin.albertycliu.xyz]
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: diag-tls
  namespace: network-diag
spec:
  secretName: diag-tls
  dnsNames: [diag.albertycliu.xyz]
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
