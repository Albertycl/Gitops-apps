apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
      annotations:
        instrumentation.opentelemetry.io/inject-python: "tcping"
        resource.opentelemetry.io/service.name: "tcping-backend"
    spec:
      containers:
        - name: backend
          image: ghcr.io/albertycl/tcping-backend
          ports:
            - { name: http, containerPort: 5427 }
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: tcping-db, key: password }
            - name: DATABASE_URL
              value: "mysql+pymysql://tcping:$(DB_PASSWORD)@mariadb:3306/tcping"
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports:
    - { name: http, port: 5427, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/albertycl/tcping-frontend
          ports:
            - { name: http, containerPort: 80 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
