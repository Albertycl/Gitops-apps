apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tcping
resources:
- namespace.yaml
- mariadb.yaml
- apps.yaml
- ingress.yaml
- certificate.yaml
- instrumentation.yaml
configMapGenerator:
- files:
  - seed.sql
  name: tcping-seed
generatorOptions:
  disableNameSuffixHash: true
images:
- name: ghcr.io/albertycl/tcping-backend
  newName: ghcr.io/albertycl/tcping-backend
  newTag: 9b7ec8a9d42954fc55c47a14ef3c76137d554443
- name: ghcr.io/albertycl/tcping-frontend
  newName: ghcr.io/albertycl/tcping-frontend
  newTag: 9b7ec8a9d42954fc55c47a14ef3c76137d554443
