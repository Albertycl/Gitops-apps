apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tcping
resources:
- namespace.yaml
- mariadb.yaml
- apps.yaml
- ingress.yaml
- certificate.yaml
- instrumentation.yaml
configMapGenerator:
- files:
  - seed.sql
  name: tcping-seed
generatorOptions:
  disableNameSuffixHash: true
images:
- name: ghcr.io/albertycl/tcping-backend
  newName: ghcr.io/albertycl/tcping-backend
  newTag: dbb076feae6c38dcba9f190a302b7dfad97d8daf
- name: ghcr.io/albertycl/tcping-frontend
  newName: ghcr.io/albertycl/tcping-frontend
  newTag: dbb076feae6c38dcba9f190a302b7dfad97d8daf
