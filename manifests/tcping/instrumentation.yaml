apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: tcping
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  exporter:
    endpoint: http://otel-collector.observability:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_always_on
  python:
    env:
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
