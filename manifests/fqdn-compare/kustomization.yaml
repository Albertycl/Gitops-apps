apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fqdn-compare
resources:
- namespace.yaml
- initdb-configmap.yaml
- mariadb.yaml
- app.yaml
- ingress.yaml
- certificate.yaml
images:
- name: ghcr.io/albertycl/fqdn-compare-backend
