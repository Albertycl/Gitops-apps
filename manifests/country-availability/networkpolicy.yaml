# Egress lock-down for the demo: pods may talk only to each other (frontend ->
# backend -> mariadb) and to cluster DNS. The probes are simulated, so the app
# needs no other outbound traffic, and nothing in this namespace can reach the
# home LAN, other namespaces or the internet. Ingress is not restricted here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-egress
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
