apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: syslog-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mariadb 3306; do echo waiting for mariadb; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { memory: 32Mi }
      containers:
        - name: backend
          image: ghcr.io/albertycl/syslog-demo-backend
          ports:
            - { name: http, containerPort: 5100 }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: syslog-demo-db, key: database-url }
            - { name: COLLECT_INTERVAL_SECONDS, value: "20" }
            - { name: COLLECT_WINDOW_MINUTES, value: "5" }
            - { name: CORS_ORIGINS, value: "http://localhost:8090" }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: syslog-demo
spec:
  selector: { app: backend }
  ports:
    - { name: http, port: 5100, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: syslog-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/albertycl/syslog-demo-frontend
          ports:
            - { name: http, containerPort: 80 }
          env:
            - { name: API_UPSTREAM, value: "http://backend:5100" }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: syslog-demo
spec:
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
