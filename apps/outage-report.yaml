apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: outage-report
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Albertycl/gitops-apps.git
    targetRevision: main
    path: manifests/outage-report
  destination:
    server: https://kubernetes.default.svc
    namespace: outage-report
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
