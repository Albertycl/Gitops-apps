apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fqdn-compare
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Albertycl/gitops-apps.git
    targetRevision: main
    path: manifests/fqdn-compare
  destination:
    server: https://kubernetes.default.svc
    namespace: fqdn-compare
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
