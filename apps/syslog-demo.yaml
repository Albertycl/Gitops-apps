apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: syslog-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Albertycl/gitops-apps.git
    targetRevision: main
    path: manifests/syslog-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: syslog-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
