apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jkb-with-country
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Albertycl/gitops-apps.git
    targetRevision: main
    path: manifests/jkb-with-country
  destination:
    server: https://kubernetes.default.svc
    namespace: jkb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
