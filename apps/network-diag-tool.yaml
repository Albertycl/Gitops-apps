apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-diag-tool
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Albertycl/gitops-apps.git
    targetRevision: main
    path: manifests/network-diag-tool
  destination:
    server: https://kubernetes.default.svc
    namespace: network-diag
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
