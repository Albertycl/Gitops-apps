<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1175 640" width="1175" height="640"><rect width="1175" height="640" fill="#fff"/><defs><marker id="h" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5b6b78"/></marker></defs><rect x="180" y="18" width="485" height="330" rx="16" fill="#f1ecf8" stroke="#6d4fa3" stroke-width="2"/><text x="195" y="42" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#6d4fa3" text-anchor="start">GitHub (Albertycl)</text><rect x="10" y="395" width="665" height="210" rx="16" fill="#dcebf1" stroke="#1f6f8b" stroke-width="2"/><text x="235" y="419" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1f6f8b" text-anchor="start">K3s cluster</text><rect x="20" y="70" width="130" height="100" rx="14" fill="#f4f6f8" stroke="#9fb3c0" stroke-width="2"/><text x="85.0" y="98" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">Developer</text><text x="85.0" y="119" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">you</text><rect x="28" y="132" width="114" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="85.0" y="150" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">git push</text><rect x="195" y="70" width="150" height="100" rx="14" fill="#dcebf1" stroke="#1f6f8b" stroke-width="2"/><text x="270.0" y="98" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">App repos</text><text x="270.0" y="119" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">GitHub Actions</text><rect x="203" y="132" width="134" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="270.0" y="150" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">ci.yml</text><rect x="525" y="70" width="150" height="100" rx="14" fill="#f4f6f8" stroke="#9fb3c0" stroke-width="2"/><text x="600.0" y="98" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">Gitops-apps</text><text x="600.0" y="119" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">manifests only</text><rect x="533" y="132" width="134" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="600.0" y="150" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">manifests/&lt;app&gt;/</text><rect x="195" y="225" width="150" height="100" rx="14" fill="#f4f6f8" stroke="#9fb3c0" stroke-width="2"/><text x="270.0" y="253" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">GHCR</text><text x="270.0" y="274" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">image registry</text><rect x="203" y="287" width="134" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="270.0" y="305" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">ghcr.io/albertycl/*</text><rect x="30" y="445" width="150" height="100" rx="14" fill="#e8f5ec" stroke="#2f9457" stroke-width="2"/><text x="105.0" y="473" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">Namespaces</text><text x="105.0" y="494" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">pods of each app</text><rect x="38" y="507" width="134" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="105.0" y="525" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">jkb, tcping, ...</text><rect x="120" y="435" width="52" height="20" rx="10" fill="#2f9457" stroke="#2f9457" stroke-width="1"/><text x="146" y="449" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#fff" text-anchor="middle">ready</text><rect x="290" y="445" width="150" height="100" rx="14" fill="#dcebf1" stroke="#1f6f8b" stroke-width="2"/><text x="365.0" y="473" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">Applications</text><text x="365.0" y="494" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">one per app</text><rect x="298" y="507" width="134" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="365.0" y="525" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">apps/&lt;app&gt;.yaml</text><rect x="525" y="445" width="150" height="100" rx="14" fill="#dcebf1" stroke="#1f6f8b" stroke-width="2"/><text x="600.0" y="473" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1d2b36" text-anchor="middle">Argo CD</text><text x="600.0" y="494" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#5b6b78" text-anchor="middle">root app, auto sync</text><rect x="533" y="507" width="134" height="26" rx="6" fill="#fff" stroke="#dfe5ea" stroke-width="1"/><text x="600.0" y="525" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="normal" fill="#3d4b57" text-anchor="middle">root-app.yaml</text><path d="M150,120 L195,120" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="172.5" cy="120" r="13" fill="#5b6b78"/><text x="172.5" y="125" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text><path d="M345,120 L525,120" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="435.0" cy="120" r="13" fill="#5b6b78"/><text x="435.0" y="125" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text><path d="M270.0,170 L270.0,225" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="270.0" cy="198" r="13" fill="#5b6b78"/><text x="270.0" y="203" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text><path d="M600.0,445 L600.0,170" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="600.0" cy="300" r="13" fill="#5b6b78"/><text x="600.0" y="305" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text><path d="M525,495 L440,495" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="482.5" cy="495" r="13" fill="#5b6b78"/><text x="482.5" y="500" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text><path d="M290,495 L180,495" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="235.0" cy="495" r="13" fill="#5b6b78"/><text x="235.0" y="500" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6</text><path d="M270.0,325 L270.0,360 L105.0,360 L105.0,445" fill="none" stroke="#5b6b78" stroke-width="2.2" marker-end="url(#h)"/><circle cx="187.5" cy="360" r="13" fill="#5b6b78"/><text x="187.5" y="365" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">7</text><rect x="690" y="20" width="470" height="600" rx="16" fill="#f7f9fb" stroke="#dfe5ea" stroke-width="2"/><text x="715" y="52" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1d2b36" text-anchor="start">Steps</text><circle cx="715" cy="81" r="13" fill="#5b6b78"/><text x="715" y="86" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="738" y="86" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">The developer pushes code to an app repo on</text><text x="738" y="106" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">GitHub.</text><circle cx="715" cy="135" r="13" fill="#5b6b78"/><text x="715" y="140" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="738" y="140" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">GitHub Actions in the app repo tests the</text><text x="738" y="160" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">code, builds the images and pushes them to</text><text x="738" y="180" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">GHCR.</text><circle cx="715" cy="209" r="13" fill="#5b6b78"/><text x="715" y="214" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="738" y="214" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">GitHub Actions runs kustomize edit set image</text><text x="738" y="234" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">and commits the new image tag to Gitops-apps</text><text x="738" y="254" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">(commit &quot;&lt;app&gt;: deploy &lt;sha&gt;&quot;).</text><circle cx="715" cy="283" r="13" fill="#5b6b78"/><text x="715" y="288" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="738" y="288" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">Argo CD (its root app) polls Gitops-apps and</text><text x="738" y="308" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">sees the new commit.</text><circle cx="715" cy="337" r="13" fill="#5b6b78"/><text x="715" y="342" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="738" y="342" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">The root app reads the apps/ folder and</text><text x="738" y="362" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">creates one Application per file in it.</text><circle cx="715" cy="391" r="13" fill="#5b6b78"/><text x="715" y="396" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6</text><text x="738" y="396" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">Each Application syncs its manifests/&lt;app&gt;/</text><text x="738" y="416" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">folder into its namespace in K3s (auto sync,</text><text x="738" y="436" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">prune, self-heal).</text><circle cx="715" cy="465" r="13" fill="#5b6b78"/><text x="715" y="470" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">7</text><text x="738" y="470" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">K3s pulls the image with the new</text><text x="738" y="490" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">tag from GHCR and starts the pods (green =</text><text x="738" y="510" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1d2b36" text-anchor="start">ready).</text></svg>